    <script>
      // Start-up guard: never leave the team looking at a blank page.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) { errors.push(e.message || String(e)); });
        window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason && e.reason.message || e.reason)); });
        function show() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount) return;
          var dev = !!document.querySelector('script[src*="main.jsx"]');
          var box = 'max-width:640px;margin:12vh auto;padding:28px 32px;font:15px/1.6 Plus Jakarta Sans,Segoe UI,system-ui,sans-serif;color:#16122a;background:#fff;border:1px solid #e6e4ef;border-radius:12px;box-shadow:0 12px 40px -16px rgba(11,31,58,.2)';
          var h = '<div style="' + box + '"><div style="font:700 20px Plus Jakarta Sans,Segoe UI,sans-serif;margin-bottom:8px;letter-spacing:-.02em">Junk Analysis · Purview Digital</div>';
          if (dev) {
            h += '<p><b>This is the developer file, so it cannot run on its own.</b></p><p>Close this tab and open <b>JGU Junk Analysis.html</b> from the same folder (D:\\PD Dashboard Dev). Double-click it, or right-click → Open with → Chrome or Edge.</p>';
          } else {
            h += '<p><b>The dashboard could not start.</b></p><p>Open this file in the latest Google Chrome or Microsoft Edge (not Internet Explorer, and not a preview pane inside another app).</p>';
            if (errors.length) h += '<p style="font:12px Consolas,monospace;background:#f5f4f7;padding:10px;border-radius:4px;color:#b42318;word-break:break-word">' + errors.slice(0, 3).join('<br>').replace(/</g, '&lt;') + '</p>';
          }
          root.innerHTML = h + '</div>';
        }
        window.__junkBootTimer = setTimeout(show, 4000);
        window.__junkBootFail = show;
      })();
    </script>
